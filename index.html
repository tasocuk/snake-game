<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yılan Oyunu 🐍</title>
  <meta name="description" content="HTML5 Canvas ile yazılmış klasik yılan oyunu. Saf JavaScript, sıfır bağımlılık, rekor kaydı." />
  <meta property="og:title" content="🐍 Yılan Oyunu" />
  <meta property="og:description" content="HTML5 Canvas ile yazılmış klasik yılan oyunu. Saf JavaScript, sıfır bağımlılık, rekor kaydı." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game">
    <h1>🐍 Yılan Oyunu</h1>

    <div class="scoreboard">
      <span>Skor: <b id="score">0</b></span>
      <span>Rekor: <b id="best">0</b></span>
    </div>

    <canvas id="board" width="400" height="400"></canvas>

    <p class="hint">Yön tuşları veya <b>W A S D</b> ile oyna. Duraklatmak için <b>Boşluk</b>.</p>

    <div id="overlay" class="overlay">
      <p id="overlay-text">Başlamak için bir tuşa bas</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
